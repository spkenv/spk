pkg: opentimelineio/0.14.1
api: v0/package

sources:
  - git: https://github.com/AcademySoftwareFoundation/OpenTimelineIO.git
    ref: v0.14.1

build:

  options:
    - var: arch    # rebuild if the arch changes
    - var: os      # rebuild if the os changes
    - var: centos  # rebuild if centos version changes

    - pkg: python-pip
    - pkg: python/3
    - pkg: gcc
    - pkg: cmake/~3.18
  variants:
    - {python: 3.7}

  script:
    # 0.14.1 uses uint64_t without including <cstdint>, which gcc 11's
    # libstdc++ no longer pulls in through other headers. This is set in the
    # environment because pip runs its own cmake build below.
    - export CXXFLAGS="-include cstdint"
    - mkdir -p build
    - cd build
    - cmake -DCMAKE_INSTALL_PREFIX=/spfs ..
    - make all -j
    - make install
    # pip builds the wheel with the newest cmake from PyPI, and CMake 4
    # rejects the old cmake_minimum_required in the bundled pybind11
    - CMAKE_POLICY_VERSION_MINIMUM=3.5 python -m pip install ..[dev]

install:
  requirements:
    - pkg: python
      fromBuildEnv: Binary

  components:
    - name: run
      files:
        - /bin/
        - /include/
        - /lib/
        - /share/

tests:
  - stage: install
    script: make test
